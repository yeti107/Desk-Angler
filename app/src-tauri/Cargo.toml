[package]
name = "app"
version = "0.0.1"
description = "Desk Angler"
authors = ["Munaan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
# Only used by the old Apple Vision camera (see the `apple-vision` feature).
objc2-av-foundation = { version = "0.3", optional = true }
objc2-vision = { version = "0.3", optional = true }
objc2-core-media = { version = "0.3", optional = true }
objc2-core-video = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
dispatch2 = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }

[features]
# Builds the old Apple Vision camera (camera.rs) instead of MediaPipe, macOS
# only: `npm run tauri dev -- --features apple-vision`. A fallback until
# MediaPipe has been tested on the Mac; delete it and camera.rs after that.
apple-vision = [
  "dep:objc2-av-foundation",
  "dep:objc2-vision",
  "dep:objc2-core-media",
  "dep:objc2-core-video",
  "dep:objc2-foundation",
  "dep:dispatch2",
  "dep:block2",
]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
